spring:
  application:
    name: subscription-microservice

  liquibase:
    defaultSchema: public
    change-log: classpath:/db/master.xml
    enabled: true

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        ddl-auto: create-drop
  datasource:
    url: jdbc:postgresql://localhost:5432/subscription
    username: sub_usr
    password: sub_pwd

logging:
  level:
    root: INFO
    com:
      microservice:
        subscription: TRACE